# Compila el mod en la nube con JDK 17 y Gradle 8.8, sin depender del entorno local.
# Uso: sube este proyecto a un repositorio de GitHub; en la pestaña "Actions" se genera el artefacto
# "teleportdevice-1.0.0" con el JAR. También se puede lanzar a mano (Run workflow).
name: Build teleportdevice

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle build --no-daemon
      - name: Subir el JAR
        uses: actions/upload-artifact@v4
        with:
          name: teleportdevice-1.0.0
          path: build/libs/teleportdevice-1.0.0.jar
          if-no-files-found: error
